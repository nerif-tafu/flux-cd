apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api
  namespace: rust-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rust-api
  template:
    metadata:
      labels:
        app: rust-api
    spec:
      containers:
        - name: rust-api
          image: ghcr.io/nerif-tafu/rust-api:v1.4.4 # {"$imagepolicy": "flux-system:rust-api"}
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            - name: GAME_DATA_DIR
              value: /data
            # Keeps the extracted item data the API serves on the volume too.
            # Left in the image layer it is wiped on every update and the API
            # serves nothing until a full re-extraction has run. AssetRipper's
            # binaries and raw export stay in the container by design — see
            # game-data-path.js.
            - name: DATA_DIR
              value: /data
            - name: STEAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rust-api-steam
                  key: STEAM_USERNAME
            - name: STEAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rust-api-steam
                  key: STEAM_PASSWORD
            - name: STEAM_APP_ID
              valueFrom:
                secretKeyRef:
                  name: rust-api-steam
                  key: STEAM_APP_ID
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rust-api-data
