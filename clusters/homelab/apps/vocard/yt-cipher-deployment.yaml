apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-cipher
  namespace: vocard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: yt-cipher
  template:
    metadata:
      labels:
        app: yt-cipher
    spec:
      initContainers:
        - name: wait-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z vocard-db 27017; do echo waiting for mongo; sleep 2; done"]
      containers:
        - name: yt-cipher
          image: ghcr.io/kikkia/yt-cipher:master@sha256:76e485a7f88363f5f67db8eeb1c7a7a6d5706c669ed0b01652e546405b0f2da2 # {"$imagepolicy": "flux-system:yt-cipher"}
          resources:
            requests:
              cpu: 20m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 6
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: yt-cipher
  namespace: vocard
spec:
  selector:
    app: yt-cipher
  ports:
    - port: 8001
      targetPort: 8001
