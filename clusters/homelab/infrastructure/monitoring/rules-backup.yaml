# Alerts for the two backup paths: the cluster-backup CronJob (control plane,
# secrets, API objects) and Longhorn's RecurringJobs (volume data).
#
# Both are watched through kube-state-metrics' Job metrics rather than through
# anything backup-specific, and that is not a workaround — it is the only thing
# that works. Verified against this cluster on 2026-08-12: Longhorn 1.6.2
# exports 46 metric families and not one of them concerns backups. The full
# list of longhorn_* names contains disk, node, volume, snapshot size and
# workqueue metrics; there is no longhorn_backup_*, no recurring job state, no
# last-success timestamp. rules-longhorn.yaml predicted this and pointed here.
#
# What makes it work is that a Longhorn RecurringJob is implemented as an
# ordinary Kubernetes CronJob in longhorn-system, so a failed backup shows up
# as kube_job_failed exactly like any other Job.
#
# NOTE ON kube_job_* SERIES: they exist only while the Job objects do. Both
# CronJobs keep a small history (successfulJobsHistoryLimit), so completion
# timestamps age out after a few days. That is why the staleness windows below
# are 36h and not a week — past the history horizon the metric vanishes and the
# "absent" alerts take over instead.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-alerts
spec:
  groups:
    - name: backup.jobs
      rules:
        # A failed Job object outlives its failure. failedJobsHistoryLimit keeps
        # the most recent failed Job around until the *next failure* replaces
        # it, so kube_job_failed stays at 1 through any number of later
        # successes. Alerting on it directly therefore paged for two days after
        # a k3s restart on 2026-09-13 fired the missed runs into a half-up
        # cluster, even though every scheduled run since had completed.
        #
        # The two recording rules below carry the owning CronJob's name onto
        # each Job (kube_job_owner) so a failure can be compared with the latest
        # success of the *same* CronJob. Only a failure newer than that success
        # alerts; once a later run completes, the alert resolves on its own.
        - record: backup:job_failed_start_seconds
          # Start time of every failed backup Job, labelled with its CronJob.
          expr: >-
            (
              kube_job_status_start_time{namespace=~"cluster-backup|longhorn-system"}
              and on (namespace, job_name) (kube_job_failed > 0)
            )
            * on (namespace, job_name) group_left (owner_name) kube_job_owner
        - record: backup:job_last_success_seconds
          # Most recent successful completion per CronJob.
          expr: >-
            max by (namespace, owner_name) (
              kube_job_status_completion_time{namespace=~"cluster-backup|longhorn-system"}
              * on (namespace, job_name) group_left (owner_name) kube_job_owner
            )

        - alert: BackupJobFailed
          # Covers both paths. A backoffLimit is exhausted before kube_job_failed
          # goes to 1, so this is a real failure, not a single flaky attempt.
          # Fires only while the failure is the CronJob's latest outcome: either
          # it started after the last success, or there has been no success at
          # all (the `unless` arm — a CronJob that has only ever failed).
          expr: >-
            (
              backup:job_failed_start_seconds
              > on (namespace, owner_name) group_left ()
              backup:job_last_success_seconds
            )
            or
            (
              backup:job_failed_start_seconds
              unless on (namespace, owner_name) backup:job_last_success_seconds
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Backup job {{ $labels.job_name }} failed ({{ $labels.namespace }})"
            description: >-
              Job {{ $labels.job_name }} in {{ $labels.namespace }} exhausted its
              retries and no later run of {{ $labels.owner_name }} has succeeded.
              Until this is fixed the cluster is running without a current
              backup. Check `kubectl -n {{ $labels.namespace }} logs
              job/{{ $labels.job_name }}`. This resolves by itself once a newer
              run completes.

    - name: backup.freshness
      rules:
        - alert: ClusterBackupStale
          # The control-plane bundle: k3s datastore, CA, join token, secrets.
          expr: >-
            (time() - max(kube_job_status_completion_time{namespace="cluster-backup"}))
            > 129600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "No successful cluster backup in {{ $value | humanizeDuration }}"
            description: >-
              The cluster-backup CronJob runs daily at 01:00. Nothing has
              completed successfully for over 36 hours, so the k3s datastore,
              cluster CA and SOPS age key are not currently backed up anywhere.

        - alert: ClusterBackupNeverRan
          # Distinct from stale on purpose: no series at all means the CronJob
          # has never produced a completed Job, which is what you see if it was
          # deployed but is silently not scheduling. Fires once after install
          # and is the intended way to notice the job never started.
          #
          # GOTCHA, observed rather than predicted: `kubectl delete job` on the
          # completed Jobs re-arms this. The metric exists only while the Job
          # objects do, so tidying up history looks identical to "the CronJob
          # has never run" and this fires 3h later. It did exactly that on
          # 2026-08-12 after a manual test Job was cleaned up, and resolved as
          # soon as a real run completed.
          #
          # So: leave the Job history alone. successfulJobsHistoryLimit on the
          # CronJob already caps it at 3, and those three are what keep both
          # this alert and ClusterBackupStale able to see anything at all.
          expr: absent(kube_job_status_completion_time{namespace="cluster-backup"})
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: "cluster-backup has never completed a run"
            description: >-
              No completed Job exists in the cluster-backup namespace. Either the
              CronJob has not fired yet, or it is failing before completion.

        - alert: LonghornBackupStale
          # Volume data. The job names are generated by Longhorn from the
          # RecurringJob name, hence the loose match rather than an exact one.
          expr: >-
            (time() - max(kube_job_status_completion_time{namespace="longhorn-system",
            job_name=~".*backup.*"})) > 129600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "No successful Longhorn backup in {{ $value | humanizeDuration }}"
            description: >-
              The daily-backup RecurringJob has not completed for over 36 hours.
              Volume data is not reaching
              nfs://192.168.3.10:/volume1/k8s-backup/longhorn. Check the backup
              target is still reachable and the NAS share is not full.
