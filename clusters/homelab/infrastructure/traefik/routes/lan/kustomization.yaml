apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - router.yaml
  - pihole.yaml
  - switch.yaml
  - kvm1.yaml
  - kvm2.yaml
  - companion-01.yaml
  - companion-02.yaml
  - backlight.yaml
  - synology.yaml
# commonLabels is deprecated in kustomize, but the reason to move is not the
# warning: commonLabels also injects into spec.selector, which gave every
# lan-* Service a selector it must not have. Those Services deliberately have
# no selector so their hand-written Endpoints (the LAN IPs) stay authoritative;
# a selector hands ownership to the endpoints controller. It happens to work
# today because the legacy Endpoints path still wins, but it is a latent
# conflict. includeSelectors: false keeps the metadata label and drops the
# selector injection.
labels:
  - pairs:
      traefik.tafu.casa/instance: internal
    includeSelectors: false
