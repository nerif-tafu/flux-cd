# Dynmap's web UI at mc.tafu.casa.
#
# No conflict with the game server on the same hostname: that is TCP 25565 on
# the gateway Traefik instance, this is 443 on the public one.
#
# The backend is the sevtech Service, not a separate one — Dynmap is a Forge mod
# running inside the game server process and serves its own web UI on 8123, so
# there is no second pod to point at.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dynmap
  namespace: sevtech
  labels:
    traefik.tafu.casa/instance: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: traefik-fail2ban-public@kubernetescrd
spec:
  ingressClassName: traefik-public
  rules:
    - host: mc.tafu.casa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sevtech
                port:
                  number: 8123
  tls:
    - hosts:
        - mc.tafu.casa
      secretName: dynmap-tls
