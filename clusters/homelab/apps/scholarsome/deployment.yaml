apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarsome
  namespace: scholarsome
spec:
  replicas: 1
  # Recreate: the media volume is ReadWriteOnce, so a rolling update would
  # deadlock with the new pod waiting on a volume the old one still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scholarsome
  template:
    metadata:
      labels:
        app: scholarsome
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z scholarsome-mariadb 3306; do echo waiting for mariadb; sleep 2; done
              until nc -z scholarsome-redis 6379; do echo waiting for redis; sleep 2; done
      containers:
        - name: scholarsome
          # The image is amd64-only — a single manifest, not an index, matching
          # the `platform: linux/amd64` in upstream's compose. Every node here
          # is amd64, so no nodeSelector is needed, but that is why this cannot
          # move to an arm node later without an upstream multi-arch build.
          #
          # No init container for migrations: the image's CMD is
          # `npm run serve:node`, which is `prisma migrate deploy` followed by
          # the server, so schema changes are applied on every start already.
          image: hwgilbert16/scholarsome:v1.2.1 # {"$imagepolicy": "flux-system:scholarsome"}
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HTTP_PORT
              value: "3000"
            # Bare hostname, no scheme — the app prefixes it itself, choosing
            # https only when SSL_KEY_BASE64/SSL_CERT_BASE64 are set. They are
            # not, because TLS terminates at Traefik: the container serves plain
            # HTTP and would otherwise try to listen on 8443 with its own cert.
            - name: HOST
              value: spanish.cl.tafu.casa
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scholarsome-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scholarsome-secret
                  key: JWT_SECRET
            - name: REDIS_HOST
              value: scholarsome-redis
            - name: REDIS_PORT
              value: "6379"
            # Redis has a password but no ACL user, so this is deliberately
            # empty rather than absent — same as upstream's compose.
            - name: REDIS_USERNAME
              value: ""
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scholarsome-secret
                  key: REDIS_PASSWORD
            - name: STORAGE_TYPE
              value: local
            - name: STORAGE_LOCAL_DIR
              value: /data
            # SMTP is deliberately unset. Upstream's behaviour without it is
            # that new accounts are verified automatically instead of waiting
            # on a confirmation mail, which is what is wanted on a LAN-only
            # instance with no mail server behind it. The trade is that
            # password reset, which mails a link, cannot work.
          volumeMounts:
            - name: data
              mountPath: /data
          # There is no health endpoint in this app, so the probes fetch the
          # frontend index. Generous delays because the container runs prisma
          # migrations before it starts listening.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scholarsome-data
