# Keeps net.bridge.bridge-nf-call-ip[6]tables pinned at 1 on every node.
#
# With that sysctl at 0, bridged frames bypass iptables, so kube-proxy's Service
# NAT never applies to pod-to-pod traffic ON THE SAME NODE. Cross-node Service
# traffic keeps working, which makes the failure nearly invisible -- it only
# appears when the scheduler co-locates a client and its backend. It surfaced
# when vocard-dashboard and vocard-db both landed on black-01 and the dashboard
# sat in Init for 40 minutes waiting on a database running on the same host.
#
# This is NOT missing configuration. /etc/sysctl.d/k8s.conf already sets both
# keys to 1 on every node and they are correct at boot. Something resets them at
# runtime and the value then stays wrong indefinitely. The node running the
# Proxmox pod has been the one reading 0 on every measurement -- it is
# privileged, shares the host network namespace, and disabling bridge netfilter
# is conventional Proxmox practice -- but that is still correlation, so this
# container logs every correction with a timestamp and node name. If the log
# lines cluster around Proxmox starting somewhere, that settles it.
#
# HISTORY, because the first attempt at this caused an outage:
# Deploying this DaemonSet on 2026-07-30 took WireGuard and the game ports
# offline. MetalLB was announcing 192.168.3.63 from black-02 while the
# traefik-gateway pod ran on black-01, so every packet to the VPN arrived on one
# node and was forwarded cross-node to another. Setting bridge-nf=1 pushed that
# forward through iptables into kube-router's per-pod chains, where it was
# REJECTed for want of a matching NetworkPolicy.
#
# That dependency is now gone: the gateway services use
# externalTrafficPolicy: Local, so MetalLB only announces .63 from a node
# actually running a gateway pod and the packet is delivered locally. With that
# in place, bridge-nf=1 was set on black-02 by hand and verified -- VPN up, game
# ports reachable from the WAN, and same-node Service traffic working on all
# three black nodes for the first time. This DaemonSet only keeps it that way.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysctl-guard
  namespace: node-config
  labels:
    app: sysctl-guard
spec:
  selector:
    matchLabels:
      app: sysctl-guard
  template:
    metadata:
      labels:
        app: sysctl-guard
    spec:
      # Host network namespace is what makes /proc/sys/net the node's own
      # rather than the pod's.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      # Must run everywhere, including a cordoned or tainted control plane —
      # a node that cannot route Service traffic is worse than one that is busy.
      tolerations:
        - operator: Exists
      containers:
        - name: guard
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -u
              echo "sysctl-guard watching ${NODE_NAME}"
              while true; do
                for k in bridge-nf-call-iptables bridge-nf-call-ip6tables; do
                  p="/proc/sys/net/bridge/${k}"
                  [ -f "$p" ] || continue
                  v="$(cat "$p")"
                  if [ "$v" != "1" ]; then
                    echo "$(date -Iseconds) ${NODE_NAME}: ${k} was ${v}, restoring to 1"
                    echo 1 > "$p"
                  fi
                done
                sleep 30
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
