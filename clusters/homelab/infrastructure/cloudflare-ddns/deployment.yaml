
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      containers:
        - name: cloudflare-ddns
          # Pinned to the digest that was already running, so this change is a
          # no-op at runtime. oznu/cloudflare-ddns has been archived upstream
          # since 2021 and :latest will never move again — but an unpinned tag
          # on the DDNS for the entire domain means a silent, unreproducible
          # image swap is one registry mishap away. favonia/cloudflare-ddns is
          # the maintained replacement when there is appetite for a migration.
          image: oznu/cloudflare-ddns:latest@sha256:19bd73d8aea9641dc329ec18ae693b2b9c33ff7cdc007f368266ce584446f995
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudflare-ddns-secret
                  key: API_KEY
            - name: ZONE
              value: "tafu.casa"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

