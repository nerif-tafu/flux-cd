; CouchDB config for the Obsidian Self-hosted LiveSync plugin.
;
; Mounted at /opt/couchdb/etc/local.d/00-livesync.ini. The `00-` prefix is
; deliberate: CouchDB writes runtime config changes (Fauxton, the _config API)
; to the LAST file it loads from local.d. Loading first leaves the image's own
; docker.ini as that write target, which is writable — this file is a
; read-only ConfigMap mount, and being the write target would make every
; runtime config change fail. Nothing here collides with docker.ini, which
; only carries [admins] and the [chttpd_auth] secret from the env vars.

[couchdb]
; Creates _users, _replicator and _global_changes at startup. This is what
; replaces upstream's couchdb-init container: their script POSTs to
; /_cluster_setup from outside, which is why their ini file carries a warning
; against setting require_valid_user (the setup call would be locked out
; before it could run). Doing it in-process sidesteps that entirely, so the
; auth lockdown below is safe to declare up front.
single_node = true
; 50MB, matching upstream — large enough for binary attachments in a vault.
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
port = 5984
; ...except_for_up, not plain require_valid_user, so that the kubelet can
; reach /_up without credentials. Everything else 401s for anonymous users.
; The only thing this exposes is {"status":"ok"}.
require_valid_user_except_for_up = true
; 4GB, for the initial push of a large vault.
max_http_request_size = 4294967296
enable_cors = true

; Deliberately NOT setting [chttpd_auth] require_valid_user, which upstream's
; init script does set alongside the [chttpd] one. Only the [chttpd] option has
; an ...except_for_up variant; the [chttpd_auth] one is absolute, and if it is
; honoured independently it would gate /_up as well — which the liveness probe
; calls, so the pod would be killed by the kubelet in a loop while CouchDB
; itself was perfectly healthy. The [chttpd] setting alone already rejects
; every anonymous request that is not /_up, so nothing is lost by omitting it.

[httpd]
WWW-Authenticate = Basic realm="couchdb"

[cors]
; The exact origins Obsidian uses: app://obsidian.md on desktop,
; capacitor://localhost on iOS/Android. Sync fails silently in the mobile app
; if these are wrong, so they are copied verbatim from upstream's config.
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost

[log]
level = warning
