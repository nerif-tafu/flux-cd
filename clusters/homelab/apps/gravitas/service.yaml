apiVersion: v1
kind: Service
metadata:
  name: gravitas
  namespace: gravitas
spec:
  type: ClusterIP
  selector:
    app: gravitas
  ports:
    - name: game
      port: 25565
      targetPort: 25565
      protocol: TCP
    # BlueMap's built-in webserver. Runs inside the game server process, like
    # Dynmap did before it, so it hangs off this Service rather than its own.
    # 8100 is BlueMap's default; Dynmap used 8123.
    - name: bluemap
      port: 8100
      targetPort: 8100
      protocol: TCP
    # RCON. ClusterIP only — there is deliberately no matching entrypoint on the
    # gateway instance, so this is not reachable from the WAN.
    - name: rcon
      port: 25575
      targetPort: 25575
      protocol: TCP
