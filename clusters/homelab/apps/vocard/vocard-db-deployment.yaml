apiVersion: apps/v1
kind: Deployment
metadata:
  name: vocard-db
  namespace: vocard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vocard-db
  template:
    metadata:
      labels:
        app: vocard-db
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongo
          # Pinned to the digest already running. mongo:8 floats across every
          # 8.x release, which for a database is a silent major-ish upgrade
          # waiting for the next reschedule.
          image: mongo:8@sha256:9e52bf8768ae4f59b9ca734845d15cee0e523ced14b900cc3692d241eec9154c
          resources:
            requests:
              cpu: 20m
              memory: 384Mi
            limits:
              memory: 1Gi
          args:
            - --oplogSize=1024
            - --wiredTigerCacheSizeGB=1
            - --auth
            - --noscripting
            - --bind_ip_all
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vocard-db-auth
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vocard-db-auth
                  key: MONGO_INITDB_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vocard-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: vocard-db
  namespace: vocard
spec:
  selector:
    app: vocard-db
  ports:
    - port: 27017
      targetPort: 27017
