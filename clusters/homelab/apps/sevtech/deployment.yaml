# SevTech: Ages 3.2.3 (Minecraft 1.12.2 + Forge), following the same shape as
# apps/minecraft: Recreate + RWO volume, ClusterIP Service, TCP exposure via the
# gateway Traefik instance rather than a LoadBalancer of its own.
#
# Three things differ from the vanilla server, all forced by this image:
#
# 1. IT DOWNLOADS THE MODPACK AT RUNTIME. No Minecraft files ship in the image;
#    first start fetches SevTech 3.2.3 and runs the Forge installer into /data.
#    That takes a long time and it is the main risk here — the image has not
#    been rebuilt in over a year, and if the upstream download location has
#    moved the container will never come up. Watch the first start.
#
# 2. IT IS BUILT FOR UNRAID, running as uid 99 / gid 100. A freshly provisioned
#    Longhorn volume mounts root-owned, so without fsGroup the install fails on
#    permissions — the same failure tesco-protein hit. fsGroup makes the kubelet
#    chown the volume to that group and set the setgid bit; OnRootMismatch keeps
#    it from re-walking a large modded world on every start.
#
# 3. MEMORY. SevTech is heavy: 4GB of heap is the practical floor and the pack
#    recommends more. JVM_OPTS sets the heap; the container limit has to sit
#    above it, because a JVM's RSS is heap plus metaspace, code cache, GC
#    structures and mod-loading overhead. 8GB heap under a 10Gi limit leaves
#    room for that without the kernel OOM-killing the server mid-save.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sevtech
  namespace: sevtech
spec:
  replicas: 1
  # RWO volume: a rolling update would deadlock, new pod waiting on a volume the
  # old pod still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sevtech
  template:
    metadata:
      labels:
        app: sevtech
    spec:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Dynmap: a server-side Forge mod that renders the world and serves its
        # own web UI on 8123. Replaces BlueMap, which could not produce 3D
        # geometry for 1.12.2 — it rendered lowres tiles only, so the page was
        # black in BlueMap's default perspective view.
        #
        # Dynmap is the right tool for this Minecraft version: it targets 1.12.2
        # directly, it is a mod rather than an offline renderer so it sees live
        # server state (player positions, chunk updates) instead of lagging
        # behind disk saves, and its isometric views work here.
        #
        # Clients need nothing installed — Dynmap is server-side only.
        #
        # Idempotent on purpose: re-fetching a jar on every restart would be
        # wasteful and would fail whenever Modrinth is unreachable, taking the
        # game server down with it.
        - name: install-dynmap
          image: curlimages/curl:8.10.1
          securityContext:
            # Root so the write into the mods directory cannot fail on
            # ownership; fsGroup already handles the group.
            runAsUser: 0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              JAR=/data/mods/Dynmap-3.5-forge-1.12.2.jar
              if [ -f "$JAR" ]; then
                echo "dynmap already installed"
              else
                mkdir -p /data/mods
                curl -fsSL -o "$JAR" \
                  https://cdn.modrinth.com/data/fRQREgAc/versions/76EfaYa6/Dynmap-3.5-forge-1.12.2.jar
                chmod 0644 "$JAR"
                echo "installed Dynmap 3.5 for forge 1.12.2"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
        # RCON, so the server console is reachable. Needed at minimum to issue
        # "dynmap fullrender": Dynmap renders on blockupdate/chunkpopulate/
        # chunkgenerate triggers, none of which ever fired for chunks that were
        # generated before the mod was installed, so spawn stays blank until a
        # full render is requested once.
        #
        # server.properties is patched here rather than shipped as a file: the
        # image writes and rewrites it, and the password has to come from the
        # SOPS secret rather than being committed. Rewriting on every start is
        # idempotent and keeps the setting from drifting.
        - name: configure-rcon
          image: curlimages/curl:8.10.1
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              PROPS=/data/server.properties
              PW="$(cat /rcon/password)"
              touch "$PROPS"
              # Strip any existing copies of the keys, then append the values we
              # want. Avoids in-place edits and is safe to repeat.
              grep -vE '^(enable-rcon|rcon\.port|rcon\.password|broadcast-rcon-to-ops)=' "$PROPS" > "$PROPS.new" || true
              {
                echo "enable-rcon=true"
                echo "rcon.port=25575"
                echo "rcon.password=$PW"
                echo "broadcast-rcon-to-ops=false"
              } >> "$PROPS.new"
              mv "$PROPS.new" "$PROPS"
              # Ownership matters here. This container runs as root so it can
              # write into the volume, but the server runs as uid 99 / gid 100
              # and rewrites server.properties itself on startup. Leaving the
              # file root-owned at 0600 locks the server out of its own config
              # and it hangs before printing anything at all.
              chown 99:100 "$PROPS"
              chmod 0600 "$PROPS"
              echo "rcon enabled on 25575 (password from secret), props owned by 99:100"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: rcon
              mountPath: /rcon
              readOnly: true
      containers:
        - name: sevtech
          # Pinned to the 3.2.3 tag's digest. Note :latest is a DIFFERENT digest
          # (a43285c6…) despite the description saying it also tracks 3.2.3, and
          # :latest on a game server is how an upstream rebuild eats a world with
          # no way back.
          image: docker.io/goobaroo/sevtechages:3.2.3@sha256:c43ec6e97a09cc9d12689b2b1cf734f5b03f4d936138d598a69d8001974cb111
          env:
            - name: EULA
              value: "true"
            - name: MOTD
              value: "SevTech: Ages - mc.tafu.casa"
            - name: JVM_OPTS
              value: "-Xms4096m -Xmx8192m"
            - name: LEVEL
              value: "world"
          ports:
            - name: game
              containerPort: 25565
              protocol: TCP
            # Dynmap's webserver, exposed at mc.tafu.casa via dynmap-ingress.
            - name: dynmap
              containerPort: 8123
              protocol: TCP
            # RCON. ClusterIP only — deliberately absent from the gateway
            # instance's ports, so it is not reachable from the WAN.
            - name: rcon
              containerPort: 25575
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 5Gi
            limits:
              memory: 10Gi
          # startupProbe rather than a long livenessProbe delay: first run has to
          # download the pack and run the Forge installer, which can take tens of
          # minutes, and a liveness probe would kill it repeatedly before it ever
          # finished. 60 x 30s gives it up to 30 minutes to open the port, and
          # liveness only begins once startup has succeeded once.
          startupProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 30
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sevtech-data
        - name: rcon
          secret:
            secretName: sevtech-rcon
