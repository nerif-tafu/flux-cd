# LOGS_API_KEY for rust-api's /api/logs and /debug/status.
#
# Both endpoints are gated behind this and return 503 with
# {"error":"Log access is not configured. Set LOGS_API_KEY to enable
# /api/logs."} when it is unset — which is what production was doing until
# 2026-08-13. Note it is a 503, not a 401: the app treats a missing key as
# "feature not configured" rather than "you are unauthorised", so it presents
# as an outage rather than an auth problem. Worth remembering next time these
# endpoints look down.
#
# Kept separate from secret.yaml (rust-api-steam) deliberately: that one holds
# Steam account credentials, and rotating or leaking one of these should not
# drag in the other.
#
# 256-bit random hex from `openssl rand -hex 32`. To rotate: generate a new
# value, re-encrypt this file with sops, and let Flux roll the deployment.
apiVersion: v1
kind: Secret
metadata:
    name: rust-api-logs
    namespace: rust-api
type: Opaque
