# RCON password for the Gravitas² server console.
#
# Reachable only on the ClusterIP: there is deliberately no rcon entrypoint on
# the gateway Traefik instance, so this is not exposed to the WAN. Reach it with
# a one-off pod, and note itzg/rcon-cli has no shell — the command goes as args,
# not through sh -c:
#
#   kubectl -n gravitas run rcon --rm -i --restart=Never \
#     --image=itzg/rcon-cli:latest \
#     --env=RCON_HOST=gravitas --env=RCON_PORT=25575 \
#     --env=RCON_PASSWORD=... -- "save-all flush"
#
# Freshly generated for this server; it is not the retired SevTech password.
