# AFFiNE at https://notes.tafu.casa, public Traefik.
# notes.tafu.casa is already a CNAME to cl.tafu.casa (checked 2026-08-17), the
# same as blog/tesco, so no new Cloudflare record is needed — only the apex is
# managed by cloudflare-ddns.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affine
  namespace: affine
  labels:
    traefik.tafu.casa/instance: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: traefik-fail2ban-public@kubernetescrd
spec:
  ingressClassName: traefik-public
  rules:
    - host: notes.tafu.casa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: affine
                port:
                  number: 80
  tls:
    - hosts:
        - notes.tafu.casa
      secretName: affine-tls
