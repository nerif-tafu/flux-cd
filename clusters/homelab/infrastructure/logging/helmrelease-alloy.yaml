# Grafana Alloy, replacing promtail (deprecated upstream, EOL March 2026).
#
# The whole risk in this migration is label compatibility. promtail currently
# writes these labels into Loki:
#
#   app, component, container, filename, instance, job, namespace, pod,
#   service_name, stream       (job is "<namespace>/<app>")
#
# Any existing Loki query, Grafana panel or future ruler rule matches on those.
# If Alloy emits a different set, nothing errors -- queries just silently stop
# returning rows. The relabel pipeline below is a deliberate transcription of
# promtail's default Kubernetes scrape config so the schema is preserved.
#
# File-based tailing (local.file_match + loki.source.file) rather than
# loki.source.kubernetes: it matches how promtail worked, keeps the `filename`
# label, and reads from disk instead of putting every pod's log stream through
# the API server.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: logging
spec:
  interval: 15m
  chart:
    spec:
      chart: alloy
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    controller:
      type: daemonset
      # MON-1: without this nothing scrapes Alloy, so there are no metrics on
      # log-shipping health at all -- no way to alert on dropped entries, write
      # failures or a shipper that has quietly stopped. promtail had the same
      # gap for its entire life here. Prometheus selects ServiceMonitors
      # cluster-wide (serviceMonitorSelector: {}), so this is picked up without
      # needing a release label.
    serviceMonitor:
      enabled: true
    alloy:
      # Required for file-based tailing: mounts /var/log so the DaemonSet can
      # read /var/log/pods/<uid>/<container>/*.log.
      mounts:
        varlog: true
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 512Mi
      configMap:
        create: true
        content: |-
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // Controller name with the ReplicaSet hash suffix stripped, used as
            // the third fallback for `app` below. Temp label; anything starting
            // "__" is dropped before the target set is emitted.
            rule {
              source_labels = ["__meta_kubernetes_pod_controller_name"]
              regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
              target_label  = "__tmp_controller_name"
            }

            // promtail falls through FOUR sources for `app`, not two. Getting
            // this wrong left `app` empty on pods carrying neither
            // app.kubernetes.io/name nor a plain `app` label, which in turn
            // produced job="<namespace>/" instead of "<namespace>/<app>" --
            // visible on the node-debugger pods during the first Alloy rollout.
            // The regex takes the first non-empty value from the ";"-joined set.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                "__meta_kubernetes_pod_label_app",
                "__tmp_controller_name",
                "__meta_kubernetes_pod_name",
              ]
              separator     = ";"
              regex         = "^;*([^;]+)(;.*)?$"
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
              separator     = ";"
              regex         = "^;*([^;]+)(;.*)?$"
              target_label  = "instance"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
              separator     = ";"
              regex         = "^;*([^;]+)(;.*)?$"
              target_label  = "component"
            }

            // job = "<namespace>/<app>", matching promtail's existing values
            // such as "cert-manager/cainjector".
            rule {
              source_labels = ["namespace", "app"]
              separator     = "/"
              target_label  = "job"
            }

            // Path the file tailer will glob, keyed on pod UID + container.
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }

          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.pod_logs.receiver]
          }

          // k3s uses containerd, so on-disk logs are in CRI format
          // ("<ts> <stream> <flags> <line>"). stage.cri unwraps that and sets
          // the `stream` label to stdout/stderr, as promtail did.
          loki.process "pod_logs" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway/loki/api/v1/push"
            }
          }
