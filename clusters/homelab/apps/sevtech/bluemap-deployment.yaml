# BlueMap CLI rendering the SevTech world and serving it at mc.tafu.casa.
#
# WHY THE CLI AND NOT THE MOD: BlueMap's Forge/Fabric builds target modern
# Minecraft only, and there is no 1.12.2 mod. The standalone CLI is a different
# matter — it was tested against this exact world on 2026-08-05 and rendered it
# start to finish in about five minutes with no format errors, despite BlueMap's
# published table listing the CLI as "1.13.2 - 26.2". That table describes the
# server-side integrations; the standalone renderer reads pre-flattening region
# files fine.
#
# WHY IT MUST SIT NEXT TO THE SERVER: sevtech-data is ReadWriteOnce, so it can
# only be attached to one NODE. podAffinity pins this alongside the SevTech pod
# so both can mount it. If SevTech moves, this follows.
#
# The world is mounted READ-ONLY. BlueMap only needs to read region files, and
# there is no reason to give a renderer write access to a live world.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluemap
  namespace: sevtech
spec:
  replicas: 1
  # RWO on bluemap-data as well, so the same rolling-update deadlock applies.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bluemap
  template:
    metadata:
      labels:
        app: bluemap
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: sevtech
              topologyKey: kubernetes.io/hostname
      initContainers:
        # Fetched at a pinned release rather than baked in, because there is no
        # official BlueMap container image. The URL is a GitHub release asset,
        # which is immutable once published.
        - name: fetch-bluemap
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /jar/bluemap-cli.jar ]; then
                curl -fsSL -o /jar/bluemap-cli.jar \
                  https://github.com/BlueMap-Minecraft/BlueMap/releases/download/v5.22/bluemap-5.22-cli.jar
                echo "downloaded bluemap 5.22 cli"
              else
                echo "jar already present"
              fi
          volumeMounts:
            - {name: jar, mountPath: /jar}
      containers:
        - name: bluemap
          # BlueMap 5.22 is compiled for Java 25 (class file 69). The docs still
          # say "Java 21 or newer"; that is stale, and 21 fails outright with
          # UnsupportedClassVersionError.
          image: docker.io/library/eclipse-temurin:25-jdk
          command: ["/bin/bash", "-ec"]
          args:
            - |
              cd /bluemap
              # First run generates the default config tree, then exits.
              if [ ! -f config/core.conf ]; then
                java -jar /jar/bluemap-cli.jar || true
              fi
              # Required before BlueMap will fetch the Minecraft client jar it
              # needs for block models and textures. This is an assertion about
              # Mojang's EULA, which is already accepted for the server itself.
              sed -i 's/accept-download: false/accept-download: true/' config/core.conf
              # Open in the 2D view, because the 3D one has nothing to draw.
              #
              # BlueMap produces no hires geometry for this world: with
              # enable-hires: true and a forced -f render that ran to
              # "up-to-date", tiles/0 stayed empty and not a single .prbm exists
              # on the volume. Lowres PNGs render correctly and serve 200. The
              # renderer can build a top-down colour map of 1.12.2 chunks but not
              # the block-model geometry the perspective view needs.
              #
              # Defaulting to perspective therefore shows a black screen over a
              # perfectly good map, which is exactly how this looked.
              sed -i 's/default-to-flat-view: false/default-to-flat-view: true/' config/webapp.conf
              # The map set is defined here and nowhere else. BlueMap generates
              # default configs (nether.conf, end.conf) pointing at a relative
              # "world" directory that does not exist in this layout. Those
              # broken maps do not merely warn — they are advertised to the web
              # app in settings.json and render as an empty black world, and
              # since the app opens the first map in that list, a working
              # overworld sits behind a black nether.
              #
              # Clearing the directory each start means the maps the app offers
              # are exactly the ones configured below, with no leftovers from a
              # previous BlueMap version's defaults.
              mkdir -p config/maps
              find config/maps -name '*.conf' -delete
              # Mirrors BlueMap's generated defaults, not a minimal subset.
              #
              # A four-line config here produced a black map: omitting a key does
              # NOT fall back to the value shown in the generated config. The
              # generated file sets enable-hires: true explicitly, and with the
              # key absent the internal default is false — so the renderer wrote
              # lowres tiles only, tiles/0 stayed empty, and the default
              # perspective view had no geometry to draw. ambient-light was
              # likewise dropped, rendering at 0.0 instead of 0.1.
              #
              # Anything set here is deliberate. Do not trim it back.
              cat > config/maps/overworld.conf <<'MAPCONF'
              world: "/mcdata/world"
              dimension: "minecraft:overworld"
              name: "SevTech Overworld"
              sorting: 0
              start-pos: { x: 0, z: 0 }
              sky-color: "#7dabff"
              void-color: "#000000"
              sky-light: 1
              ambient-light: 0.1
              remove-caves-below-y: 55
              cave-detection-ocean-floor: -5
              cave-detection-uses-block-light: false
              min-inhabited-time: 0
              render-edges: true
              edge-light-strength: 8
              # The two 3D modes are switched off because they cannot render:
              # both draw from hires geometry, and BlueMap generates none for
              # this world. Offering a mode that shows a black screen is worse
              # than not offering it. enable-hires stays true so that if a future
              # BlueMap gains 1.12.2 model support, the tiles start appearing and
              # these can simply be flipped back on.
              enable-perspective-view: false
              enable-flat-view: true
              enable-free-flight-view: false
              enable-hires: true
              storage: "file"
              # SevTech is 261 mods deep and some 1.12.2 mods do not persist light
              # data the way vanilla does. Tolerating that is preferable to
              # rendering black patches where the data is absent.
              ignore-missing-light-data: true
              MAPCONF
              # THE INITIAL RENDER MUST COMPLETE BEFORE WATCHING STARTS.
              #
              # With -u active from the outset, this never finishes. The live
              # server rewrites the spawn region roughly once a minute, the
              # watcher schedules an update for it, and the in-progress render
              # restarts — region (-1,0) climbed to 73% and dropped back to 9%
              # indefinitely. The map never reached "up-to-date" and, critically,
              # never wrote a single hires tile: tiles/0 stayed empty while
              # lowres 1/2/3 filled in. BlueMap's default perspective view draws
              # from hires, so the web page was black no matter how correct the
              # lowres data was.
              #
              # A plain -r pass has no watcher to preempt it and completes in a
              # few minutes. Once hires tiles exist, incremental updates are
              # cheap and the watcher can keep up. The marker makes this a
              # one-time cost rather than something repeated on every restart.
              # The marker is versioned. BlueMap tracks what it has rendered in
              # rstate and will skip tiles it believes are current, so a config
              # change that alters HOW tiles are drawn needs a forced pass —
              # enable-hires in particular, whose own documentation says
              # "requires a re-render of the map". Bumping the suffix is how that
              # is requested: a new marker means one -f pass, once.
              if [ ! -f .initial-render-complete-v2 ]; then
                echo "forcing a full render (hires enabled, config v2)"
                java -jar /jar/bluemap-cli.jar -r -f -v 1.12.2 -n /mcdata/mods \
                  && touch .initial-render-complete-v2
              fi
              # -r render, -u keep watching and update as the world changes,
              # -w serve it. All three are needed: -ru alone renders but never
              # binds 8100, and -w alone serves without rendering.
              #
              # -v 1.12.2 is not optional. Without it BlueMap defaults to "the
              # latest compatible version" and downloads minecraft-client-26.2,
              # then renders a 1.12.2 world with modern textures and block
              # models. This is the client jar that makes the CLI version-
              # agnostic; pointing it at the wrong version silently produces a
              # wrong-looking map rather than an error.
              #
              # -n /mcdata/mods gives it SevTech's 261 mod jars as a resource
              # source. Without it every modded block falls back to a default,
              # which on a pack this size is most of the interesting map.
              exec java -jar /jar/bluemap-cli.jar -r -u -w \
                -v 1.12.2 \
                -n /mcdata/mods
          ports:
            - name: http
              containerPort: 8100
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            # Rendering is memory-hungry in bursts; a full pass over SevTech's
            # dimensions is well above idle.
            limits:
              memory: 4Gi
          # The webserver does not bind until the initial render finishes, so
          # startup has to tolerate that. 60 x 30s allows half an hour, which is
          # far more than the few minutes this world needs but leaves room as it
          # grows. Liveness only applies once startup has succeeded once.
          startupProbe:
            tcpSocket:
              port: 8100
            periodSeconds: 30
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8100
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8100
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: jar
              mountPath: /jar
            - name: bluemap
              mountPath: /bluemap
            - name: mcdata
              mountPath: /mcdata
              readOnly: true
      volumes:
        - name: jar
          emptyDir: {}
        - name: bluemap
          persistentVolumeClaim:
            claimName: bluemap-data
        - name: mcdata
          persistentVolumeClaim:
            claimName: sevtech-data
            readOnly: true
