# cert-manager alerts. Metrics are already exposed and scraped via
# infrastructure/cert-manager/helmrelease.yaml (prometheus.servicemonitor.enabled).
#
# Every public hostname on this cluster depends on the letsencrypt-cloudflare
# ClusterIssuer and the *.cl.tafu.casa wildcard. A silent renewal failure surfaces
# as a browser TLS error weeks later, which is exactly the failure mode these
# rules exist to prevent.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-alerts
spec:
  groups:
    - name: cert-manager.certificates
      rules:
        - alert: CertManagerCertExpiringSoon
          # Let's Encrypt certs are 90d and cert-manager renews at 30d remaining.
          # 21d means two renewal attempts have already failed.
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < (21 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
            description: >-
              Renewal should have happened at 30 days remaining and did not.
              Check the Certificate, CertificateRequest and Order objects, and the
              cloudflare-api-token secret used by the DNS01 solver.

        - alert: CertManagerCertExpiringCritical
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < (7 * 24 * 3600)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
            description: >-
              This certificate will break TLS for its hostname within a week.

        - alert: CertManagerCertNotReady
          # condition="True" carries value 0 when the cert is NOT ready.
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
            description: >-
              cert-manager cannot issue or renew this certificate. Common causes on
              this cluster: expired Cloudflare API token, DNS01 propagation timeout,
              or Let's Encrypt rate limits.

    - name: cert-manager.controller
      rules:
        - alert: CertManagerDown
          # Deliberately keyed on a metric the controller emits per-Certificate
          # rather than up{job=...} — the job label depends on how the chart names
          # its ServiceMonitor, and this cluster always has Certificates.
          expr: absent(certmanager_certificate_ready_status)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "cert-manager is not reporting any certificate metrics"
            description: >-
              Either cert-manager is down or its ServiceMonitor stopped matching.
              While this is true, no certificate on the cluster is being renewed.

        - alert: CertManagerAcmeRequestErrors
          expr: |
            sum by (status) (rate(certmanager_http_acme_client_request_count{status!~"2.."}[10m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "cert-manager ACME requests failing with status {{ $labels.status }}"
            description: >-
              Sustained non-2xx responses from Let's Encrypt. If status is 429 you
              have hit a rate limit — stop deleting/recreating Certificates and wait,
              because retrying makes the lockout longer.
