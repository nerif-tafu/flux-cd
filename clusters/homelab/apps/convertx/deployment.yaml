apiVersion: apps/v1
kind: Deployment
metadata:
  name: convertx
  namespace: convertx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: convertx
  template:
    metadata:
      labels:
        app: convertx
    spec:
      containers:
        - name: convertx
          image: ghcr.io/c4illin/convertx:v0.9.0 # {"$imagepolicy": "flux-system:convertx"}
          resources:
            requests:
              cpu: 20m
              memory: 384Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 6
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: convertx-secret
                  key: JWT_SECRET
          ports:
            - containerPort: 3000
          volumeMounts:
            # Keeps mydb.sqlite on Longhorn. It runs in WAL mode, which SQLite
            # documents as unsafe on network filesystems.
            - name: data
              mountPath: /app/data
            # Both from the same claim, so moving a finished conversion from
            # uploads/ to output/ stays a same-filesystem rename. Two separate
            # volumes would make it EXDEV.
            - name: files
              mountPath: /app/data/uploads
              subPath: uploads
            - name: files
              mountPath: /app/data/output
              subPath: output
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: convertx-data
        - name: files
          persistentVolumeClaim:
            claimName: convertx-files
