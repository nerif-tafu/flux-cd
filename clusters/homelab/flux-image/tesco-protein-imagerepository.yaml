apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tesco-protein
  namespace: flux-system
spec:
  image: ghcr.io/nerif-tafu/tesco-protein
  # Prime-numbered interval, like the other ghcr entries here, so the scans
  # don't re-align into one burst against ghcr.io/token. This image ships
  # weekly at most, so the extra ~80s of latency over a flat 5m costs nothing.
  interval: 6m23s
  secretRef:
    name: ghcr-registry-secret
