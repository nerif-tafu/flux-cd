apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: wg-easy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wg-easy
  template:
    metadata:
      labels:
        app: wg-easy
    spec:
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:15.3.0 # {"$imagepolicy": "flux-system:wg-easy"}
          env:
            - name: INSECURE
              value: "true"
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: http
              containerPort: 51821
          volumeMounts:
            - name: wireguard
              mountPath: /etc/wireguard
          securityContext:
            capabilities:
              add:
                # NET_ADMIN is genuinely required: wg-easy creates the wg0
                # interface and manages routes inside its own netns.
                - NET_ADMIN
                # SYS_MODULE was here, along with a /lib/modules hostPath, so
                # the container could modprobe wireguard itself. That is
                # effectively root on the node -- the ability to load arbitrary
                # kernel modules -- granted so a VPN app could load one module
                # that the host can load for it.
                #
                # Removed after making the module load at boot instead:
                # /etc/modules-load.d/wireguard.conf now exists on all four
                # nodes, so wg0 can be created without the container being able
                # to touch the kernel. The hostPath went with it.
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: wireguard
          persistentVolumeClaim:
            claimName: wg-easy-wireguard
      # A pod securityContext with `sysctl:` (singular) used to sit here. The
      # field is `sysctls`, so the API server dropped the whole block silently —
      # the live pod's securityContext has been {} the entire time and none of
      # those values were ever applied. Removed rather than corrected, because
      # removing it is a no-op (kubectl diff against the live Deployment shows
      # no change, so no rollout) while correcting it is not.
      #
      # If you ever do want them set explicitly, note that net.ipv4.ip_forward
      # and the net.ipv6.*.forwarding entries are *unsafe* sysctls: the kubelet
      # rejects them unless started with --allowed-unsafe-sysctls, and the pod
      # will fail with SysctlForbidden. In practice they are not needed — the
      # container has NET_ADMIN and wg-easy v15 sets forwarding itself, which is
      # why the VPN has worked fine all along without them.
