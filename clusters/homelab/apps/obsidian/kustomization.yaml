apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Generated rather than written as a plain ConfigMap (which is what the rest of
# this repo does) specifically because the mount is a subPath. A subPath mount
# never picks up ConfigMap updates, and editing a plain ConfigMap does not
# restart anything — so a config change would reconcile green and do nothing
# until someone happened to restart the pod. The generated name carries a
# content hash, so any edit to livesync.ini rolls the Deployment.
configMapGenerator:
  - name: couchdb-config
    namespace: obsidian
    files:
      - 00-livesync.ini=livesync.ini
