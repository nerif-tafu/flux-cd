# Reconciliation failures across the whole GitOps pipeline.
#
# eventSources cannot use a wildcard namespace — notification-controller defaults
# an omitted namespace to the Alert's own namespace, so every namespace that holds
# a HelmRelease must be listed explicitly. Add a line here when a new namespace
# gains a HelmRelease, or its failures will be silent.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: gitops-errors
  namespace: flux-system
spec:
  providerRef:
    name: discord-gitops
  eventSeverity: error
  eventMetadata:
    cluster: homelab
  # DO NOT add an exclusionList here until the Prometheus backstop is real.
  #
  # An exclusionList for transient network errors was added on 2026-07-31 to cut
  # the 24 Discord messages a single wedged connection produces, on the reasoning
  # that anything persistent was still covered by FluxReconciliationFailure at
  # critical severity. That reasoning was wrong, and the check that would have
  # caught it was never run.
  #
  # FluxReconciliationFailure cannot fire. Its expression reads
  # gotk_reconcile_condition, and that metric does not exist in this Prometheus —
  # the flux-controllers job IS scraped, but the controllers at these versions
  # emit only gotk_reconcile_duration_seconds, gotk_event_http_* and
  # gotk_token_cache_*. The rule reports health=ok and state=inactive, which
  # looks healthy and is why it went unnoticed. FluxSuspended is dead for the
  # same reason (gotk_suspend_status).
  #
  # So these notifications are not a duplicate of the Prometheus path. For
  # ImageRepository and ImagePolicy failures they are currently the ONLY path.
  # Excluding them meant the ghcr.io outage that morning would have produced
  # silence rather than noise.
  #
  # The noise is real and worth fixing, but the order matters: make
  # FluxReconciliationFailure actually fire first, prove it, and only then
  # consider trimming here.
  eventSources:
    # Sources and Kustomizations (all live in flux-system)
    - kind: GitRepository
      name: '*'
    - kind: HelmRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    # Image automation — scan failures, auth failures, push failures.
    # ImageUpdateAutomation is deliberately absent: it is covered by the
    # image-updates Alert, which runs at info severity and so already
    # includes its errors. Listing it here too would double-post.
    - kind: ImageRepository
      name: '*'
    - kind: ImagePolicy
      name: '*'
    # HelmReleases, one entry per namespace that has one.
    - kind: HelmRelease
      name: '*'
      namespace: cert-manager
    - kind: HelmRelease
      name: '*'
      namespace: logging
    - kind: HelmRelease
      name: '*'
      namespace: longhorn-system
    - kind: HelmRelease
      name: '*'
      namespace: metallb-system
    - kind: HelmRelease
      name: '*'
      namespace: monitoring
    - kind: HelmRelease
      name: '*'
      namespace: traefik
