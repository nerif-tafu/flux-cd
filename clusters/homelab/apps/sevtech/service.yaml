apiVersion: v1
kind: Service
metadata:
  name: sevtech
  namespace: sevtech
spec:
  type: ClusterIP
  selector:
    app: sevtech
  ports:
    - name: game
      port: 25565
      targetPort: 25565
      protocol: TCP
    # Dynmap's built-in webserver. Served inside the game server process, not a
    # separate pod, so it hangs off this Service rather than one of its own.
    - name: dynmap
      port: 8123
      targetPort: 8123
      protocol: TCP
    # RCON. On the ClusterIP only — there is deliberately no matching entrypoint
    # on the gateway Traefik instance, so this is not reachable from the WAN.
    # Reach it from inside the cluster.
    - name: rcon
      port: 25575
      targetPort: 25575
      protocol: TCP
