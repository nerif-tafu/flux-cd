# RESOLVED 2026-08-13 — the inode problem this file documents is gone. The
# Dynmap tiles moved to the NAS (see pvc-dynmap.yaml) and the old copy was
# deleted from this volume after both sides were counted and matched exactly at
# 3,925,145 files. Result on the live volume:
#
#     inodes  3,932,163 -> 3,827 used   (76% -> 1%)
#     bytes          38G -> 7.6G used   (49% -> 10%)
#
# btrfs allocates inodes dynamically, so the ceiling described below simply does
# not exist on the NAS. The mkfsParams "-i 8192" StorageClass mentioned further
# down is therefore no longer needed for this workload — moving the tiles off
# ext4 entirely was the cheaper fix, and it did not require a new StorageClass.
#
# THIS CLAIM IS NOW BADLY OVERSIZED: 80Gi holding 7.6G, which books 240Gi of
# Longhorn scheduling budget for ~23Gi of real need. Shrinking it means the
# usual delete-and-recreate migration, and unlike the 2026-08-11 expansion there
# is now a working backup to fall back on. Worth doing; ~220Gi is the largest
# single reclaim left on this cluster.
#
# One thing the move cost, recorded so it is not rediscovered the hard way: the
# first pod start after the cutover took ~45 minutes of downtime because kubelet
# applied fsGroup: 100 across all 3.9M files on the NFS volume at ~97,000
# files/min. fsGroupChangePolicy: OnRootMismatch was already set and did not
# help, because rsync --numeric-ids had preserved root:root on the share's root
# directory, so the root mismatched and it recursed anyway. chown the
# destination to the right gid DURING the migration, while the app is still up,
# and the cutover restart costs seconds instead.
#
# --- historical, kept because the reasoning is still the reference ---
#
# Expanded 60Gi -> 80Gi on 2026-08-11. THIS ONE WAS ABOUT INODES, NOT BYTES.
#
# The server wedged in Init:CrashLoopBackOff on "No space left on device" while
# df -h showed the volume 64% full (37.8G of 58.9G). It had run out of inodes:
# 3,932,160 used, 0 free. /data/dynmap held 3,928,396 of them -- 99.9% of every
# inode on the volume -- against 1,534 for the actual world save.
#
# Expanding fixes this, because ext4 adds block groups (each with its own inode
# table) as it grows. Verified on this volume rather than assumed: the observed
# 3,932,160 is exactly 60Gi/16384, three times the 1,310,720 it would have had
# at 20Gi. So inodes scale at 65,536 per GiB, and 80Gi buys 5,242,880 -- about
# 1.31M free, against the ~830k tile backlog left from the last render.
#
# It is a ceiling raise, not a cure. Tiles average 8,282 bytes but ext4
# provisions one inode per 16,384, so this volume will always exhaust inodes at
# roughly 60% bytes -- you buy inodes at about twice the disk cost, and half the
# added space stays unused. That ratio is also why KubePersistentVolumeFillingUp
# never fired; only the Inodes variant caught it, and only intermittently,
# because kubelet stops publishing volume stats while the pod has no running
# container. Fixing the ratio properly means a StorageClass with
# mkfsParams "-i 8192", which only applies to new volumes and so needs a
# migration.
#
# The earlier sizing note still holds: the SpawnCircle task generates 305,236
# chunks (a 10000-block-wide circle at spawn), rendered across flat/surface/cave
# as chunks generate rather than after.
#
# EXPANSION IS ONE-WAY. Kubernetes PVCs cannot be shrunk, so this size is a
# floor from here on. Longhorn does it online, with the volume attached. The
# extra 20Gi costs 60GB across the three replicas (black-01/02/03), leaving the
# tightest of them at ~151GB free.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sevtech-data
  namespace: sevtech
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 80Gi
