# DATABASE_URL is stored whole rather than assembled in the deployment: the app
# takes a single connection URI, and building it with $(DATABASE_PASSWORD)
# interpolation would put the password in the pod spec.
#
# Upstream's compose reuses one password for both mariadb and redis. These are
# separate — nothing requires them to match, and sharing one means a leak of
# either is a leak of both.
