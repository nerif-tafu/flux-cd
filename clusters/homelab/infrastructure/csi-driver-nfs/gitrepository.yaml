# csi-driver-nfs is the one upstream here with no real chart repository: it
# serves index.yaml straight out of its git tree at
# https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts.
# There is no OCI chart either -- checked registry.k8s.io and ghcr.io.
#
# Sourcing it that way works, but it pins to whatever `master` happens to be
# serving rather than to a release, and it puts a CDN in the path of a storage
# driver's chart. A GitRepository on an immutable tag is the more reproducible
# shape, so that is what this is. helm-controller packages the chart out of the
# checkout; the rendered objects were byte-identical to what the published .tgz
# produced, diffed against the live release before the switch, with the only
# delta being the helm.toolkit.fluxcd.io labels Flux adds itself.
#
# What actually prompted the change was a burst of FluxHelmRepositoryFailed
# alerts on 2026-08-17. Those were a GitHub-wide incident -- raw content and
# archive downloads at ~50% error rate, githubstatus.com had it -- and not, as
# first diagnosed, a rate-limit on this cluster's egress IP. It would have
# cleared on its own, and nothing was ever broken: source-controller kept the
# last good index throughout. Do not read this comment as evidence that
# raw.githubusercontent.com is unreachable from here; it is not.
#
# Note for anyone debugging a similar alert: a HelmRepository's
# status.artifact.lastUpdateTime is NOT the last successful fetch.
# source-controller only rewrites the artifact when the index digest changes,
# so a stale timestamp just means upstream has not cut a release. Use the Ready
# condition's lastTransitionTime instead.
#
# The tag is the version pin, so it replaces chart.spec.version on the
# HelmRelease. Upgrading means bumping the tag AND the chart path below, since
# upstream keeps each release's chart in a directory named for its own version.
# sparseCheckout keeps this to ~2MB of a repo that is otherwise ~90MB of Go
# vendor tree.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 12h
  url: https://github.com/kubernetes-csi/csi-driver-nfs
  ref:
    tag: v4.13.4
  sparseCheckout:
    - charts/v4.13.4/csi-driver-nfs
