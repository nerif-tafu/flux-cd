# CouchDB at https://notes.tafu.casa, reused from the AFFiNE attempt.
#
# There is no wildcard on tafu.casa — notes.tafu.casa exists as an explicit
# CNAME to cl.tafu.casa, while sync/couch/etc. are NXDOMAIN (checked
# 2026-08-17). Reusing the record that already exists is the only choice here
# that needs no Cloudflare change; a nicer name like sync.tafu.casa means
# adding the CNAME by hand first.
#
# Public rather than traefik-internal, because the point of LiveSync is the
# phone syncing when it is not on the LAN. Everything except /_up rejects
# anonymous requests (see livesync.ini), and fail2ban fronts it as with the
# other public apps. Putting it on the internal class and reaching it over
# wg-easy is the tighter option if you would rather not expose it at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: couchdb
  namespace: obsidian
  labels:
    traefik.tafu.casa/instance: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: traefik-fail2ban-public@kubernetescrd
spec:
  ingressClassName: traefik-public
  rules:
    - host: notes.tafu.casa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: couchdb
                port:
                  number: 5984
  tls:
    - hosts:
        - notes.tafu.casa
      secretName: couchdb-tls
