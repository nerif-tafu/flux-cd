# The media library, moved off Longhorn onto the NAS.
#
# WHY THE WHOLE OF /data AND NOT JUST THE VIDEOS: there is nothing else to
# split off. The library is flat — one directory per title holding the video
# and its sidecar files — and there is no database, index or state file
# anywhere under /data. The app's entire state *is* the library.
#
# Splitting it would also walk straight back into a bug this deployment already
# fixed once. deployment.yaml carries the note "TMP on same filesystem as
# LIBRARY_ROOT — Node rename() from /tmp to /data fails with EXDEV", and
# TMPDIR is set to /data/tmp for that reason. Keeping /data on one filesystem
# keeps the rename intra-device. Putting .thumbnails or .previews on a separate
# Longhorn volume for browse latency was considered and rejected on the same
# grounds: any generated file renamed from tmp into a different mount is the
# same EXDEV failure again.
#
# The 50Gi request is advisory and the number is close to meaningless: NFS has
# no per-volume enforcement, so the real ceiling is the 4TB btrfs quota on the
# k8s-bulk share, shared with sevtech's tiles, rust-api, filebrowser and
# convertx. A pod here sees the share's free space in `df` — 3.6T — no matter
# what this says. Treat it as documentation of intent, not a limit.
#
# Resized 1Ti -> 50Gi on 2026-08-12. PVCs cannot be shrunk, so this was done by
# deleting and recreating the claim rather than editing it. That is only safe
# because the class sets reclaimPolicy: Retain and onDelete: retain, and
# because subDir is templated from namespace and claim name — the replacement
# claim resolves to the same /volume1/k8s-bulk/webplayer-webplayer-media
# directory and picks the existing 17.5G back up untouched.
#
# NOT BACKED UP — by design. See
# infrastructure/csi-driver-nfs/storageclass-nfs-bulk.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webplayer-media
  namespace: webplayer
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-bulk
  resources:
    requests:
      storage: 50Gi
