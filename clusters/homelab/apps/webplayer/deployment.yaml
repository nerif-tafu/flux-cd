apiVersion: apps/v1
kind: Deployment
metadata:
  name: webplayer
  namespace: webplayer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webplayer
  template:
    metadata:
      labels:
        app: webplayer
    spec:
      # Use node L2/L3 for 192.168.3.0/24 (LAN APIs, NAS, etc.); default pod CIDR + SNAT can fail ACLs or routing.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        # TMP on same filesystem as LIBRARY_ROOT — Node rename() from /tmp to /data fails with EXDEV.
        - name: ensure-tmp
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /data/tmp && chmod 1777 /data/tmp
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: webplayer
          image: ghcr.io/throwmyaway1038471/webplayer:1.4.0 # {"$imagepolicy": "flux-system:webplayer"}
          # 1Gi -> 4Gi on 2026-08-12 for upload spikes (app buffers the whole
          # file in memory). 4Gi -> 8Gi on 2026-08-13: 1.3.0 OOMKilled under the
          # 4Gi ceiling and crash-looped (exit 137), taking the Traefik backend
          # down. Steady-state is still ~120-250Mi; the limit is headroom for
          # upload/preview spikes, not a new working set.
          resources:
            requests:
              cpu: 20m
              memory: 320Mi
            limits:
              memory: 8Gi
          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 6
          env:
            - name: ALLOWED_HOSTS
              value: "webplayer.cl.tafu.casa"
            - name: LIBRARY_ROOT
              value: "/data"
            - name: TMPDIR
              value: "/data/tmp"
          ports:
            - containerPort: 5173
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Moved off Longhorn onto the NAS on 2026-08-12; see pvc-media.yaml for
        # why the whole of /data went rather than just the video files. The old
        # webplayer-data claim is still declared in pvc.yaml but no longer
        # mounted — it holds the pre-migration copy until the move is trusted.
        - name: data
          persistentVolumeClaim:
            claimName: webplayer-media
