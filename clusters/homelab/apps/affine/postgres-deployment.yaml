apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-postgres
  namespace: affine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: affine-postgres
  template:
    metadata:
      labels:
        app: affine-postgres
    spec:
      containers:
        - name: postgres
          # pgvector rather than plain postgres: AFFiNE's Prisma migrations
          # create the `vector` extension unconditionally, even with the
          # indexer disabled, and stock postgres:16 does not ship it.
          #
          # Digest-pinned for the same reason as ghost's mysql — pg16 is a
          # floating tag that moves on every patch release, and a pod
          # reschedule should not be able to bring up a different database
          # build than the one that wrote the volume.
          image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 1Gi
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: affine
            - name: POSTGRES_DB
              value: affine
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine-secret
                  key: POSTGRES_PASSWORD
            # initdb refuses to run in a directory that already has something
            # in it, and a freshly formatted ext4 Longhorn volume always has
            # lost+found. Keeping the cluster one level down sidesteps that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "affine", "-d", "affine"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "affine", "-d", "affine"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: affine-postgres-data
