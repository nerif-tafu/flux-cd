# Keeps net.bridge.bridge-nf-call-ip[6]tables pinned at 1 on every node.
#
# Why this exists: with that sysctl at 0, bridged frames bypass iptables, so
# kube-proxy's Service NAT never applies to pod-to-pod traffic *on the same
# node*. Cross-node Service traffic keeps working, which makes the failure
# almost invisible — it only appears when the scheduler happens to co-locate a
# client and its backend. It surfaced when vocard-dashboard and vocard-db both
# landed on black-01 and the dashboard sat in Init for 40 minutes waiting for a
# database that was running six feet away.
#
# This is NOT missing configuration. /etc/sysctl.d/k8s.conf already sets both
# keys to 1 on every node, and they are correct at boot. Something resets them
# at runtime, and the value stays wrong long after the cause has moved on.
#
# Prime suspect is the Proxmox pod: it is privileged, shares the host network
# namespace, and disabling bridge netfilter is conventional Proxmox practice.
# The correlation has held every time it has been measured — the node running
# Proxmox reads 0, the others read 1 — but correlation is not proof, which is
# why this container logs every correction it makes. If the log lines cluster
# around Proxmox starting on a node, that is the answer. If they appear
# elsewhere, the real cause is something else and the logs will say so.
#
# Either way the drift is repaired within 30 seconds rather than persisting
# until someone notices an app cannot reach its database.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysctl-guard
  namespace: node-config
  labels:
    app: sysctl-guard
spec:
  selector:
    matchLabels:
      app: sysctl-guard
  template:
    metadata:
      labels:
        app: sysctl-guard
    spec:
      # Host network namespace is what makes /proc/sys/net the node's own
      # rather than the pod's.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      # Must run everywhere, including a cordoned or tainted control plane —
      # a node that cannot route Service traffic is worse than one that is busy.
      tolerations:
        - operator: Exists
      containers:
        - name: guard
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -u
              echo "sysctl-guard watching ${NODE_NAME}"
              while true; do
                for k in bridge-nf-call-iptables bridge-nf-call-ip6tables; do
                  p="/proc/sys/net/bridge/${k}"
                  [ -f "$p" ] || continue
                  v="$(cat "$p")"
                  if [ "$v" != "1" ]; then
                    echo "$(date -Iseconds) ${NODE_NAME}: ${k} was ${v}, restoring to 1"
                    echo 1 > "$p"
                  fi
                done
                sleep 30
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
