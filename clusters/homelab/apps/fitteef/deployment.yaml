apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitteef
  namespace: fitteef
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fitteef
  template:
    metadata:
      labels:
        app: fitteef
    spec:
      securityContext:
        fsGroup: 65533
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: fitteef
          # Second instance of the fitv2 app; shares the fitv2 ImagePolicy so both
          # deployments are bumped by the same image automation run.
          image: ghcr.io/nerif-tafu/fitv2:v1.3.3 # {"$imagepolicy": "flux-system:fitv2"}
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fitteef-data
