# Everything needed to rebuild this cluster that is NOT a Longhorn volume and
# NOT in the git repo. Longhorn's own RecurringJobs handle volume data; see
# infrastructure/longhorn/recurringjobs.yaml.
#
# Runs at 01:00, an hour ahead of the Longhorn backups at 02:00. Both cross the
# same single 1GbE link to the NAS, and this one is small and quick — better it
# finishes before the long job starts than contend with it.
#
# Pinned to the control-plane node because the k3s datastore only exists there.
# silver-01 is the only server node, so this is also a statement of fact about
# the cluster's single point of failure: if silver-01's disk dies, this backup
# and the machine it describes are lost together. That is the scenario the
# offline recovery key exists for.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-backup
  namespace: cluster-backup
spec:
  schedule: "0 1 * * *"
  timeZone: Etc/UTC
  # Forbid, not Replace: a run that is still going is copying a 291MB datastore
  # over 1GbE, and starting a second one alongside it makes both slower.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # If the node was down at 01:00, still run when it comes back within the hour.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: cluster-backup
          # The datastore, token and tls/ are mode 0600 root-owned on the host.
          securityContext:
            runAsUser: 0
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          initContainers:
            - name: datastore
              image: python:3.12-slim
              command: ["python3", "/scripts/datastore.py"]
              volumeMounts:
                - name: k3s-server
                  mountPath: /k3s
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
            - name: api-dump
              # Tracks the cluster's 1.34.x; kubectl skew of one minor is fine
              # but the dump is only as good as the API version it understands.
              image: alpine/k8s:1.34.9
              command: ["sh", "/scripts/api-dump.sh"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
          containers:
            - name: package
              image: python:3.12-slim
              command: ["sh", "/scripts/package.sh"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                - name: cert
                  mountPath: /cert
                - name: backup
                  mountPath: /backup
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
          volumes:
            # Read-write, though nothing writes through it: SQLite needs to
            # share the -shm file with the live k3s process to open the WAL
            # database at all. datastore.py explains the read-only attempt.
            - name: k3s-server
              hostPath:
                path: /var/lib/rancher/k3s/server
                type: Directory
            - name: work
              emptyDir:
                # The uncompressed datastore plus the API dump. 291MB + ~24MB
                # today; 2Gi leaves room to grow before this starts evicting.
                sizeLimit: 2Gi
            - name: scripts
              configMap:
                name: cluster-backup-scripts
            - name: cert
              configMap:
                name: backup-recovery-cert
            # Mounted directly rather than through a PVC: this is one fixed
            # path that must stay predictable across a total rebuild. A PVC
            # would name the directory after a UID that only exists in the
            # cluster the backup is meant to survive.
            - name: backup
              nfs:
                server: 192.168.3.10
                path: /volume1/k8s-backup/cluster
