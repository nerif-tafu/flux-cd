
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      containers:
        - name: cloudflare-ddns
          # Migrated off oznu/cloudflare-ddns, archived upstream since 2021, to
          # the maintained favonia replacement. Digest-pinned as usual.
          #
          # Settings chosen to reproduce the old behaviour exactly, not to adopt
          # favonia's defaults:
          #   PROXIED=false    — tafu.casa resolves straight to the WAN IP today;
          #                      favonia would otherwise be free to orange-cloud it.
          #   IP6_PROVIDER=none — the zone has no AAAA record. Left unset, favonia
          #                      tries to manage IPv6 and errors on every run.
          # The secret key is still API_KEY (its value is a scoped API token, not
          # a global key) so the SOPS secret did not need re-encrypting; favonia
          # reads it under its own name.
          image: favonia/cloudflare-ddns:1.17.0@sha256:61013368c8f95981c0bb8bf56d962078d8b4e95724a554fa2dabb20d6e478097
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-ddns-secret
                  key: API_KEY
            - name: DOMAINS
              value: "tafu.casa"
            - name: PROXIED
              value: "false"
            - name: IP6_PROVIDER
              value: "none"
            - name: UPDATE_CRON
              value: "@every 5m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

