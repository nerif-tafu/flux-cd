# Reconciliation failures across the whole GitOps pipeline.
#
# eventSources cannot use a wildcard namespace — notification-controller defaults
# an omitted namespace to the Alert's own namespace, so every namespace that holds
# a HelmRelease must be listed explicitly. Add a line here when a new namespace
# gains a HelmRelease, or its failures will be silent.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: gitops-errors
  namespace: flux-system
spec:
  providerRef:
    name: discord-gitops
  eventSeverity: error
  eventMetadata:
    cluster: homelab
  # Transient outbound-network failures are dropped here on purpose.
  #
  # notification-controller has no grouping or aggregation: it posts one Discord
  # message per event per object. So a single network fault that stalls every
  # ImageRepository at once arrives as one message each — 24 of them on
  # 2026-07-31, all describing the same wedged connection.
  #
  # Nothing is lost by excluding them, because a failure that actually persists
  # is already covered on the Prometheus path: FluxReconciliationFailure fires
  # for any Flux object stuck Ready=False for 15m, at critical severity, which
  # is the route that can @mention. Alertmanager groups those, so the same
  # incident produces one notification instead of two dozen.
  #
  # The trade is that a fault which self-clears inside 15m is now silent. That
  # is the intent: it self-cleared.
  exclusionList:
    - "context deadline exceeded"
    - "connection refused"
    - "no route to host"
    - "TLS handshake timeout"
    - "i/o timeout"
  eventSources:
    # Sources and Kustomizations (all live in flux-system)
    - kind: GitRepository
      name: '*'
    - kind: HelmRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    # Image automation — scan failures, auth failures, push failures.
    # ImageUpdateAutomation is deliberately absent: it is covered by the
    # image-updates Alert, which runs at info severity and so already
    # includes its errors. Listing it here too would double-post.
    - kind: ImageRepository
      name: '*'
    - kind: ImagePolicy
      name: '*'
    # HelmReleases, one entry per namespace that has one.
    - kind: HelmRelease
      name: '*'
      namespace: cert-manager
    - kind: HelmRelease
      name: '*'
      namespace: logging
    - kind: HelmRelease
      name: '*'
      namespace: longhorn-system
    - kind: HelmRelease
      name: '*'
      namespace: metallb-system
    - kind: HelmRelease
      name: '*'
      namespace: monitoring
    - kind: HelmRelease
      name: '*'
      namespace: traefik
