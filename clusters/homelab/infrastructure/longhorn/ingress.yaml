apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  labels:
    traefik.tafu.casa/instance: internal
  annotations:
    # SEC-1: Longhorn's UI has no auth of its own. Without this, anyone on the
    # LAN or the VPN can delete any volume in the cluster.
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-ui-auth@kubernetescrd
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts:
        - longhorn.cl.tafu.casa
      secretName: longhorn-cl-tafu-casa-tls
  rules:
    - host: longhorn.cl.tafu.casa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
