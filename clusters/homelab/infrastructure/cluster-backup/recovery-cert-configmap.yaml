# The PUBLIC half of the backup recovery keypair. Safe to commit: it can only
# encrypt. The private key is deliberately not in this repo and not in the
# cluster — if it were, an attacker who reached the cluster could decrypt the
# backups of that same cluster, and a total-loss event would take the key with
# it.
#
# The private key lives offline (password manager / printed). Without it the
# nightly bundles are unrecoverable ciphertext, so verify you still have it
# before you ever need it.
#
# Fingerprint (SHA-256):
#   14:C6:9D:EA:DD:1C:84:B0:73:B9:76:47:E2:FB:E3:98:DA:15:DE:81:9E:F4:5E:BF:8B:F8:54:8F:49:D8:29:90
# Valid until 2046-08-07.
#
# To decrypt a bundle:
#   openssl smime -decrypt -binary -inform DER \
#     -in cluster-YYYY-MM-DD.tar.gz.enc \
#     -inkey cluster-backup-recovery.key | tar xzf -
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-recovery-cert
  namespace: cluster-backup
