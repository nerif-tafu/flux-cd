# TCP/UDP gateway at 192.168.3.63: WireGuard only (51820/udp), KAG (50301), Minecraft (25565). wg-easy frontend via vpn.cl.tafu.casa only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-gateway
  namespace: traefik
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      # 26.0.0 (Traefik v2.10.6) -> 41.1.0 (Traefik v3.7.9).
      #
      # Verified before upgrading:
      #   - all 21 IngressRoute/TCP/UDP/Middleware objects are already on the
      #     traefik.io API group; zero remain on traefik.containo.us, which v3
      #     drops entirely
      #   - the fail2ban plugin pinned at v0.8.9 loads under v3.7.9. Confirmed
      #     empirically by running traefik:v3.7.9 with that plugin: it reported
      #     "Plugins loaded. plugins=[fail2ban]". This mattered because the
      #     plugin's last release was April 2024 and neither its repo nor the
      #     Traefik plugin catalogue state v3 support
      #   - fail2ban-public uses only `plugin`, none of the middleware fields
      #     v3 removed (ipWhiteList and friends)
      #
      # Chart value schema changes this required:
      #   logs.access.*        -> accessLog.*        (`logs` is rejected outright)
      #   ports.<n>.expose:bool -> expose.default:bool
      version: "41.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    service:
      type: LoadBalancer
      # Separate TCP and UDP services so MetalLB can share one IP (mixed-protocol LB often broken)
      single: false
      annotations:
        metallb.universe.tf/allow-shared-ip: traefik-gateway
      spec:
        loadBalancerIP: 192.168.3.63
        # NET-1. traefik-public already uses Local to preserve client source
        # IPs; here the reason is different and load-bearing.
        #
        # With Cluster, MetalLB announces .63 from an arbitrary node — it was
        # black-02 — while the traefik-gateway pod runs elsewhere (black-01).
        # Every packet to the VPN and game ports therefore arrives on one node
        # and is forwarded cross-node to another. That forwarding path is what
        # broke when net.bridge.bridge-nf-call-iptables was set to 1 on
        # black-02: bridged frames start traversing iptables, hit kube-router's
        # per-pod chains, and are REJECTed for want of a matching NetworkPolicy.
        # The result was a total loss of WireGuard and the game ports while
        # every other service stayed up, which took a while to attribute.
        #
        # With Local, MetalLB only announces .63 from a node that actually runs
        # a ready gateway pod, so the packet is delivered locally and never
        # takes that forward. That removes the dependency on any particular
        # node's bridge-netfilter setting, which in turn makes it safe to set
        # bridge-nf-call-iptables=1 on black-02 and fix the same-node Service
        # hairpin that is broken there today.
        externalTrafficPolicy: Local
    # Chart v26 expects expose as boolean; don't expose default HTTP entrypoints
    ports:
      web:
        expose:
          default: false
      websecure:
        expose:
          default: false
      traefik:
        expose:
          default: false
      metrics:
        expose:
          default: false
      # wg-easy WireGuard only (frontend is internal at vpn.cl.tafu.casa)
      wireguard:
        port: 51820
        expose:
          default: true
        exposedPort: 51820
        protocol: UDP
      # KAG game server
      kagtcp:
        port: 50301
        expose:
          default: true
        exposedPort: 50301
        protocol: TCP
      kagudp:
        port: 50301
        expose:
          default: true
        exposedPort: 50301
        protocol: UDP
      # Minecraft
      factorio:
        port: 34197
        expose:
          default: true
        exposedPort: 34197
        protocol: UDP
      minecraft:
        port: 25565
        expose:
          default: true
        exposedPort: 25565
        protocol: TCP
    providers:
      kubernetesCRD:
        labelSelector: "traefik.tafu.casa/instance=gateway"
        allowCrossNamespace: true
    # No Ingress provider needed; only TCP/UDP CRDs
    ingressRoute:
      dashboard:
        enabled: false
