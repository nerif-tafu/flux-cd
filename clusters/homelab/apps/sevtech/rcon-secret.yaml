# RCON password for the SevTech server.
#
# Generated with openssl on silver-01 and encrypted there, so the plaintext
# never reached the workstation or git. The filename contains "secret" because
# .sops.yaml's creation rule matches on that — a Secret in this tree named
# otherwise gets no rule and would be committed in the clear.
#
# RCON is reachable on the ClusterIP Service only. It is deliberately NOT added
# to the gateway Traefik instance, so it is not exposed to the WAN: the router
# forwards 25565 and the other explicitly listed game ports, and 25575 is not
# among them.
