apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipe-dreams
  namespace: pipe-dreams
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pipe-dreams
  template:
    metadata:
      labels:
        app: pipe-dreams
    spec:
      containers:
        - name: pipe-dreams
          image: ghcr.io/nerif-tafu/pipe-dreams:v1.0.8 # {"$imagepolicy": "flux-system:pipe-dreams"}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          env:
            # Keep the downloaded item data and images on the mounted volume.
            # Without this they are written into the image layer, so every
            # image update silently empties the item list until someone runs
            # a refresh again.
            - name: DATA_DIR
              value: /data
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pipe-dreams-data
