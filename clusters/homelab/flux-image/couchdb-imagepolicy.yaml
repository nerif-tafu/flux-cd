# Bounded to 3.x. CouchDB majors are migrations, not upgrades — 4.0 replaces
# the storage engine, so it is not something to walk into by way of an
# automated commit at 3am.
#
# Worth noting this is a database on an auto-update policy at all, which the
# rest of this repo deliberately avoids: ghost's mysql is digest-pinned flat,
# on the grounds that a reschedule should never change the build that wrote
# the volume. The difference is that this is the whole app rather than a
# dependency of one, and 3.x patch releases are where the CVE fixes land for
# something that is publicly exposed. If that trade stops feeling right,
# deleting these two files and pinning the tag is the whole rollback.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: couchdb
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: couchdb
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=3.5.0 <4.0.0"
