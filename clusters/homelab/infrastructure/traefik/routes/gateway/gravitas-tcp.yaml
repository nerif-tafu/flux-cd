# Minecraft TCP on the gateway instance, now pointed at All The Mods - Gravitas².
# Replaces SevTech: Ages, retired 2026-08-13, which itself replaced the vanilla
# server on 2026-08-05.
#
# The entrypoint is still called `minecraft` and still listens on 25565. That
# name is left alone on purpose: renaming it would mean editing the gateway
# HelmRelease's ports block as well, and the port is what the router forwards —
# the WAN has exactly one 25565, which is the whole reason two servers cannot
# coexist here.
#
# HostSNI(`*`) because Minecraft is not TLS. Traefik cannot see a hostname in
# the Minecraft handshake, so this entrypoint serves exactly one backend.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gravitas
  namespace: traefik
  labels:
    traefik.tafu.casa/instance: gateway
spec:
  entryPoints:
    - minecraft
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gravitas
          namespace: gravitas
          port: 25565
