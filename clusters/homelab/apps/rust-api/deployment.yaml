apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api
  namespace: rust-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rust-api
  template:
    metadata:
      labels:
        app: rust-api
    spec:
      containers:
        - name: rust-api
          image: ghcr.io/nerif-tafu/rust-api:v1.5.2 # {"$imagepolicy": "flux-system:rust-api"}
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            - name: GAME_DATA_DIR
              value: /data
            # Keeps the extracted item data the API serves on the volume too.
            # Left in the image layer it is wiped on every update and the API
            # serves nothing until a full re-extraction has run. AssetRipper's
            # binaries and raw export stay in the container by design — see
            # game-data-path.js.
            - name: DATA_DIR
              value: /data
            - name: STEAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rust-api-steam
                  key: STEAM_USERNAME
            - name: STEAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rust-api-steam
                  key: STEAM_PASSWORD
            - name: STEAM_APP_ID
              valueFrom:
                secretKeyRef:
                  name: rust-api-steam
                  key: STEAM_APP_ID
            # Gates /api/logs and /debug/status. Unset, the app serves 503 on
            # both with "Log access is not configured" — a 503 rather than a
            # 401, so it reads as an outage. See logs-secret.yaml.
            - name: LOGS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rust-api-logs
                  key: LOGS_API_KEY
      volumes:
        # Moved off Longhorn onto the NAS on 2026-08-12; see pvc-bulk.yaml.
        # 58G of Rust client and map assets across only 3,326 files, which is
        # the shape NFS handles well. The old rust-api-data claim is still
        # declared in pvc.yaml but no longer mounted.
        - name: data
          persistentVolumeClaim:
            claimName: rust-api-bulk
