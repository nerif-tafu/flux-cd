# One volume for both of AFFiNE's on-disk paths, split by subPath:
#   storage/ — blobs and user avatars (the fs storage provider)
#   config/  — private.key, generated by the predeploy job on first boot and
#              used to sign session tokens. Losing it logs everyone out and
#              invalidates existing invite links, so it is not scratch data.
# Longhorn's `default` recurring-job group picks this up for nightly backups
# with nothing to declare here — see infrastructure/longhorn/recurringjobs.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-data
  namespace: affine
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
