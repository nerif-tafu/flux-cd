# SEC-1: basic auth in front of the Longhorn UI.
#
# Longhorn's frontend has no authentication of its own. Until now anyone who
# could reach longhorn.cl.tafu.casa -- everyone on the LAN, and everyone on the
# WireGuard VPN -- could browse in and delete any volume in the cluster,
# including the ones holding Ghost's database, Proxmox VM disks and the UniFi
# controller.
#
# Labelled for the internal instance because that is the only Traefik that
# serves this hostname; the middleware must live in the same namespace as the
# Ingress that references it (longhorn-system), and is addressed as
# longhorn-system-longhorn-ui-auth@kubernetescrd.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-ui-auth
  namespace: longhorn-system
  labels:
    traefik.tafu.casa/instance: internal
spec:
  basicAuth:
    secret: longhorn-ui-auth
    removeHeader: true
    realm: Longhorn
