# mc.tafu.casa now serves BlueMap instead of Dynmap. Hostname and TLS secret
# are reused deliberately: the certificate is already issued and trusted, and
# the name describes the server rather than the map mod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluemap
  namespace: gravitas
  labels:
    traefik.tafu.casa/instance: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: traefik-fail2ban-public@kubernetescrd
spec:
  ingressClassName: traefik-public
  rules:
    - host: mc.tafu.casa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gravitas
                port:
                  number: 8100
  tls:
    - hosts:
        - mc.tafu.casa
      secretName: bluemap-tls
