apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "55.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Prometheus: 15d retention for homelab; discovers ServiceMonitors in all namespaces (Traefik, etc.)
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 8GB
        serviceMonitorNamespaceSelector: {}
        # IMPORTANT: allow selecting ServiceMonitors across the cluster (e.g. Traefik's)
        # The chart defaults to selecting only ServiceMonitors with release=kube-prometheus-stack.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
    grafana:
      enabled: true
      # Change password after first login or set admin.existingSecret
      ingress:
        enabled: false
      service:
        type: ClusterIP
      grafana.ini:
        dashboards:
          default_home_dashboard_path: /tmp/dashboards/homelab-main.json
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local
          jsonData:
            timeout: 60
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 120h
        # NOTE: no image override here on purpose.
        #
        # discord_configs is the natural fit, but prometheus-operator v0.70.0
        # (chart 55.0.0) validates this config with its own vendored parser
        # BEFORE generating the StatefulSet, and that parser predates both
        # `content` and `webhook_url_file`:
        #
        #   sync "monitoring/kube-prometheus-stack-alertmanager" failed:
        #   provision alertmanager configuration: failed to initialize from
        #   secret: field content not found in type config.plain
        #   ...field webhook_url_file not found in type config.plain
        #
        # The operator gatekeeps, so pinning a newer Alertmanager image does
        # not help — it never gets applied. Hence slack_configs below, which
        # v0.70.0 does understand, pointed at Discord's Slack-compatible
        # endpoint. Trade-off: the body lands in an attachment, which Discord
        # renders as an embed, and mentions inside embeds do not ping.
        #
        # To get @mentions back: upgrade kube-prometheus-stack to a version
        # whose operator understands the modern schema, then swap these
        # receivers back to discord_configs with webhook_url_file +
        # content: '<@107411599001710592>' and pin alertmanager >= v0.28.0.
        # The bare (non-/slack) URL is already in the secret for that day.
        #
        # Mounts at /etc/alertmanager/secrets/alertmanager-discord-webhook/<key>
        secrets:
          - alertmanager-discord-webhook
      config:
        global:
          resolve_timeout: 5m

        route:
          receiver: discord-warning
          # Group by alert + namespace so one bad node produces a few messages,
          # not one per pod.
          group_by: ['alertname', 'namespace']
          group_wait: 45s
          group_interval: 5m
          # Sustained problems re-notify twice a day rather than every 4h.
          repeat_interval: 12h
          routes:
            # Watchdog fires constantly by design — it is the dead-man's switch.
            # Drop it here; see the heartbeat note at the bottom of this file.
            - receiver: 'null'
              matchers:
                - alertname = "Watchdog"
            # k3s embeds these components and does not expose scrape targets for
            # them, so the stock rules can never be satisfied. KubeProxyDown in
            # particular has been firing continuously on this cluster.
            - receiver: 'null'
              matchers:
                - alertname =~ "KubeProxyDown|KubeSchedulerDown|KubeControllerManagerDown|KubeEtcdDown|InfoInhibitor"
            # CPU throttling is meaningless until resource requests exist on the
            # 30 deployments that currently have none. Re-enable after that.
            - receiver: 'null'
              matchers:
                - alertname =~ "CPUThrottlingHigh|KubeCPUOvercommit|KubeMemoryOvercommit"
            # Promoted to the pinging receiver despite shipping as severity=warning
            # upstream. Verified against the live cluster: KubeNodeNotReady and
            # KubeNodeUnreachable are both firing for black-03 at severity=warning,
            # and a dead node is exactly the case that should ping rather than post
            # silently. Same for a volume that is filling.
            - receiver: discord-critical
              matchers:
                - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|KubePersistentVolumeFillingUp|KubePersistentVolumeErrors"
              group_wait: 15s
              repeat_interval: 4h
            - receiver: discord-critical
              matchers:
                - severity = "critical"
              group_wait: 15s
              repeat_interval: 4h
            - receiver: discord-warning
              matchers:
                - severity =~ "warning|info"

        inhibit_rules:
          # Don't send the warning version of something already reported critical.
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity = "warning"']
            equal: ['alertname', 'namespace']
          # A dead node produces a cascade. Report the node, suppress the fallout.
          # The target list was built from what black-03 is actually generating
          # right now: 7x KubeDaemonSetRolloutStuck, 6x KubeDaemonSetMisScheduled,
          # 5x KubePodNotReady, 4x KubeDeploymentReplicasMismatch, 3x
          # KubeContainerWaiting, 1x KubeStatefulSetReplicasMismatch. Without this
          # rule, one dead node is ~26 Discord messages.
          - source_matchers: ['alertname =~ "KubeNodeNotReady|KubeNodeUnreachable"']
            target_matchers:
              - 'alertname =~ "KubePodNotReady|KubePodCrashLooping|KubeContainerWaiting|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDaemonSetMisScheduled|KubeDaemonSetRolloutStuck|LonghornNodeNotReady|LonghornVolumeDegraded|TraefikBackendDown"'
          # A faulted volume is already degraded; only say it once.
          - source_matchers: ['alertname = "LonghornVolumeFaulted"']
            target_matchers: ['alertname = "LonghornVolumeDegraded"']
            equal: ['volume']
          # Expiring-critical supersedes expiring-soon for the same certificate.
          - source_matchers: ['alertname = "CertManagerCertExpiringCritical"']
            target_matchers: ['alertname = "CertManagerCertExpiringSoon"']
            equal: ['namespace', 'name']

        receivers:
          - name: 'null'

          # Deliberately minimal attachments: Discord's Slack-compat endpoint
          # supports a subset of Slack's schema and 400s on some fields, so no
          # fields/actions/footer here.
          - name: discord-critical
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/cluster-webhook-url-slack
                channel: homelab-cluster
                username: alertmanager
                send_resolved: true
                color: '{{ if eq .Status "firing" }}#d93f3f{{ else }}#2eb886{{ end }}'
                title: '{{ if eq .Status "firing" }}[CRITICAL x{{ .Alerts.Firing | len }}] {{ else }}[RESOLVED] {{ end }}{{ .CommonLabels.alertname }}'
                text: |-
                  {{ range .Alerts -}}
                  *{{ .Annotations.summary }}*
                  {{ .Annotations.description }}
                  {{ with .Labels.namespace }}ns=`{{ . }}` {{ end }}{{ with .Labels.pod }}pod=`{{ . }}` {{ end }}{{ with .Labels.node }}node=`{{ . }}`{{ end }}
                  {{ end }}
                footer: ''
                short_fields: false

          - name: discord-warning
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/cluster-webhook-url-slack
                channel: homelab-cluster
                username: alertmanager
                send_resolved: true
                color: '{{ if eq .Status "firing" }}#d9a13f{{ else }}#2eb886{{ end }}'
                title: '{{ if eq .Status "firing" }}[warning x{{ .Alerts.Firing | len }}] {{ else }}[RESOLVED] {{ end }}{{ .CommonLabels.alertname }}'
                text: |-
                  {{ range .Alerts -}}
                  *{{ .Annotations.summary }}*
                  {{ .Annotations.description }}
                  {{ with .Labels.namespace }}ns=`{{ . }}` {{ end }}{{ with .Labels.pod }}pod=`{{ . }}` {{ end }}{{ with .Labels.node }}node=`{{ . }}`{{ end }}
                  {{ end }}
                footer: ''
                short_fields: false

        # Heartbeat: Watchdog is routed to 'null' above because it fires every
        # 30s. To prove the whole pipeline is alive, point a free dead-man's-switch
        # service (healthchecks.io, Better Stack) at Watchdog via a webhook receiver
        # and let it alert you by email if the pings stop. Discord is the wrong
        # place for a heartbeat — you would learn to ignore it.
        #
        # On @mentions: there is no way to get a real ping out of this receiver.
        # Alertmanager's Slack payload carries the body inside attachments[] and
        # sends no top-level text, so Discord always renders an embed — and a
        # mention inside an embed does not notify anyone. Putting the mention in
        # title: or text: would look right and silently never ping.
        # Pings require discord_configs + content:, which needs the chart upgrade
        # described above. Until then, critical alerts are visually distinct
        # (red, [CRITICAL xN]) but silent.
