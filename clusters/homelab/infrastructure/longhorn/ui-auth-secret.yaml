# Basic-auth credentials for the Longhorn UI (longhorn.cl.tafu.casa).
#
# Longhorn's frontend ships with no authentication whatsoever, so anyone on the
# LAN -- or on the WireGuard VPN -- could reach it and delete any volume in the
# cluster. Traefik's basicAuth middleware is the gate.
#
# The value is a bcrypt htpasswd line, generated on the cluster node so the
# plaintext never touched a workstation. SOPS encrypts it again on top.
