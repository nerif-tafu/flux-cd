# All The Mods - Gravitas², replacing SevTech: Ages (retired 2026-08-13).
#
# Minecraft 1.20.1 / Forge. An expert pack built on TerraFirmaCraft with deep
# GregTech integration, so it is heavy on both CPU and memory — the resource
# numbers below are not vanilla numbers.
#
# WHY itzg/minecraft-server RATHER THAN A PREBUILT PACK IMAGE: SevTech ran a
# community image with the pack baked in, which meant the pack version was
# whatever the image author had built. This installs the pack at first start
# from CurseForge, so the version is pinned in git and visible here.
#
# JAVA 17, PINNED DELIBERATELY. The default tag now ships Java 21, and 1.20.1
# Forge is a Java 17 target. Running it on 21 is a known source of subtle mod
# breakage, and this cluster already has one Java-version incident on record
# (Distant Horizons needing 21 on a 17 server). Pinning removes the question.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitas
  namespace: gravitas
spec:
  replicas: 1
  # Recreate, not RollingUpdate: gravitas-data is RWO and a second pod would
  # deadlock waiting for the volume, and two servers must never hold one world.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gravitas
  template:
    metadata:
      labels:
        app: gravitas
    spec:
      # itzg runs as uid/gid 1000. OnRootMismatch matters here: the SevTech
      # cutover cost 45 minutes of downtime because kubelet recursively chowned
      # 3.9M files on an NFS volume whose root gid did not match fsGroup. These
      # volumes start empty and are created by this pod, so the roots match from
      # the outset and the recursive walk never happens.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gravitas
          image: itzg/minecraft-server:java17
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: AUTO_CURSEFORGE
            - name: CF_SLUG
              value: all-the-mods-gravitas2
            # Pinned to the 0.9.4a CLIENT pack.
            #
            # IT MUST BE THE CLIENT FILE, NOT THE SERVER FILE. This was pinned
            # to CF_FILE_ID 7618834 (ATMGravitas2-server-0.9.3a.zip) first and
            # the container crash-looped on:
            #
            #   Modpack zip did not contain a manifest.json.
            #   Only client modpack files contain manifest
            #
            # AUTO_CURSEFORGE reads the client pack's manifest.json and builds
            # the server from it; the vendor's own "server" zip has no manifest
            # and is unusable here. Counter-intuitive, hence the note.
            #
            # Matched by filename rather than file ID because the two variants
            # differ only by prefix — client is `Gravitas2-0.9.4a.zip`, server is
            # `ATMGravitas2-server-0.9.4a.zip` — so this substring selects the
            # client unambiguously while still pinning the version. An expert
            # pack's progression is tied to its recipe and quest state, so a
            # floating version can change a live world's rules on restart.
            - name: CF_FILENAME_MATCHER
              value: "Gravitas2-0.9.4a"
            # Extra mods installed from Modrinth on top of the CurseForge pack.
            # VERIFIED to work alongside AUTO_CURSEFORGE: both jars are present
            # in mods/ after install, so the earlier doubt about whether the
            # pack's cleanup would strip them is settled — it does not.
            #
            # bluemap is pinned by exact version ID, not "latest". The current
            # BlueMap release (5.23) targets Forge 26.x, and 1.20.1 is Forge
            # 47.x, so "latest" installs a jar that cannot load. 5.3 is the
            # newest build supporting 1.20.1 Forge on Java 17; 5.12 needs 21.
            #
            # caelum is a MISSING PACK DEPENDENCY, not a preference. Forge
            # refused to start with "Mod tfccaelum requires caelum 1.20.1-2 or
            # above": the pack ships TFCCaelum but its manifest omits caelum
            # itself, so nothing installed it.
            #
            # CF_FORCE_INCLUDE_MODS does NOT fix that, which cost a deploy to
            # learn. It only un-excludes mods already in the manifest and
            # explicitly "won't download additional mods" — with caelum absent
            # entirely, it had nothing to act on. Left unpinned so it resolves
            # to whatever satisfies ">= 1.20.1-2" for this loader and version.
            - name: MODRINTH_PROJECTS
              value: "bluemap:aHbq9KFB,caelum"
            # Heap. Leaves headroom under the 16Gi limit for Forge's off-heap
            # and metaspace, which GregTech and TFC both use heavily.
            - name: MEMORY
              value: "10G"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gravitas-rcon
                  key: password
            - name: TZ
              value: Etc/UTC
          ports:
            - name: game
              containerPort: 25565
              protocol: TCP
            - name: bluemap
              containerPort: 8100
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 5Gi
            limits:
              memory: 16Gi
          # First start has to download the pack, unpack it, and generate a
          # TerraFirmaCraft world — tens of minutes, and longer on a cold NAS.
          # 120 x 30s gives it an hour before anything gives up; liveness only
          # begins once startup has succeeded once, so a slow first boot cannot
          # be killed halfway through world generation.
          startupProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 30
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            # BlueMap's whole data folder: tile store and web assets both.
            - name: map
              mountPath: /data/bluemap
      # SIGTERM has to be enough for the server to flush the world. The default
      # 30s was not enough for SevTech — its migration needed an explicit RCON
      # `save-all flush` first to avoid racing the kill. 300s lets a heavy pack
      # save and stop on its own, so an ordinary restart is not a data risk.
      terminationGracePeriodSeconds: 300
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gravitas-data
        - name: map
          persistentVolumeClaim:
            claimName: gravitas-map
