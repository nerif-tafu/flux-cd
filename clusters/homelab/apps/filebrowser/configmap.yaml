# Persisted via PVC at /home/filebrowser/data/config.yaml (see deployment volumeMounts).
#
# v2 layout (2.0.0 upgrade, 2026-10-13). HTTP options moved from `server` to
# `http`, the database moved from BoltDB (database.db) to SQLite, and the old
# flat userDefaults format was removed. The four file permissions that used to
# live in userDefaults.permissions are per-source in v2, so they are now
# sources[].config.defaultPermissions; api/admin/share/realtime stay global
# under userDefaults.account.permissions.
#
# Every field set under userDefaults is locked in Settings -> User defaults in
# the UI. That is intended: this file stays the source of truth.
#
# The BoltDB was imported once via server.database.migrateFrom, which has since
# been removed. database.db.old stays on the PVC as an offline rollback copy
# (with a second copy off-cluster); nothing reads it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: filebrowser
data:
  config.yaml: |
    http:
      port: 80
      baseURL: "/"
      # Behind traefik-public. Traefik overwrites X-Forwarded-*/X-Real-IP from
      # untrusted clients, so these headers carry the real client address.
      trustProxyHeaders: true
    server:
      database:
        path: /home/filebrowser/data/filebrowser.sqlite
      cacheDir: /home/filebrowser/data/tmp
      logging:
        - levels: "info|warning|error"
      sources:
        - path: /srv
          config:
            defaultEnabled: true
            defaultPermissions:
              view: true
              download: true
              modify: false
              create: false
              delete: false
    auth:
      adminUsername: admin
      methods:
        password:
          enabled: true
          signup: false
    userDefaults:
      ui:
        darkMode: true
      sidebar:
        sticky: true
      listing:
        viewMode: normal
        singleClick: false
        showHidden: false
      preview:
        image: true
        video: true
        audio: true
        motionVideoPreview: true
        office: true
        popup: true
        folder: true
        models: true
      fileViewer:
        autoplayMedia: true
      account:
        lockPassword: false
        disableSettings: false
        permissions:
          api: false
          admin: false
          share: false
          realtime: false
