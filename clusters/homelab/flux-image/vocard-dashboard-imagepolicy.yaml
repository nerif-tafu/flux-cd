apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vocard-dashboard
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: vocard-dashboard
  # Same as vocard: "beta" is the only tag upstream publishes and it moves.
  digestReflectionPolicy: Always
  interval: 10m
  policy:
    alphabetical:
      order: desc
