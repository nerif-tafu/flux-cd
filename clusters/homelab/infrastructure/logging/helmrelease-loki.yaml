apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 15m
  chart:
    spec:
      chart: loki
      version: "6.53.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    deploymentMode: SingleBinary

    # Ensure SimpleScalable targets are disabled (chart validates this).
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      # Pinned to exactly what useTestSchema was already generating, verified
      # against the live ConfigMap before the change — so this is a no-op today.
      #
      # The schema itself was never the problem: tsdb + v13 is the current
      # recommended combination, not a degraded test setting. The problem was
      # ownership. With useTestSchema the schema is whatever the CHART decides,
      # so a chart upgrade can silently introduce a different schema period —
      # and a schema that moves underneath existing data is how old logs become
      # unreadable. Writing it down means an upgrade can change the chart
      # without changing the storage contract.
      #
      # If a genuinely new schema is ever wanted, do NOT edit this entry. Append
      # a second config with a future `from` date and leave this one intact:
      # Loki reads each period with the schema in force at the time, so rewriting
      # history is what breaks reads, not adding to it.
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      # LOG-2: the ruler, so log-only events can alert.
      #
      # Some things only ever exist as a log line. fail2ban bans are the case
      # that motivated this: the plugin keeps its state in memory and emits no
      # metric, so the only evidence a ban happened is Traefik's stdout. Nothing
      # in Prometheus can see it.
      #
      # The chart already runs the loki-sc-rules sidecar and mounts /rules — it
      # was just never pointed anywhere. This supplies the missing half: where to
      # read rules from, and which Alertmanager to notify.
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/ruler-rules-tmp
        # Same Alertmanager the Prometheus rules use, so Loki-sourced alerts get
        # the same grouping, inhibition and Discord routing as everything else
        # rather than a parallel notification path.
        alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        enable_alertmanager_v2: true
        ring:
          kvstore:
            store: inmemory

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 20Gi
        storageClass: longhorn
