apiVersion: v1
kind: Service
metadata:
  name: sevtech
  namespace: sevtech
spec:
  type: ClusterIP
  selector:
    app: sevtech
  ports:
    - name: game
      port: 25565
      targetPort: 25565
      protocol: TCP
    # Dynmap's built-in webserver. Served inside the game server process, not a
    # separate pod, so it hangs off this Service rather than one of its own.
    - name: dynmap
      port: 8123
      targetPort: 8123
      protocol: TCP
