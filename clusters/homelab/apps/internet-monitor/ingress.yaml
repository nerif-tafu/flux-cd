# Dashboard at https://uptime.cl.tafu.casa, LAN only (internal Traefik, .62).
# *.cl.tafu.casa already resolves there, so no new DNS record is needed; the
# certificate is issued over DNS-01 and does not need a public A record either.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internet-monitor
  namespace: internet-monitor
  labels:
    traefik.tafu.casa/instance: internal
spec:
  ingressClassName: traefik-internal
  rules:
    - host: uptime.cl.tafu.casa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: internet-monitor
                port:
                  number: 80
  tls:
    - hosts:
        - uptime.cl.tafu.casa
      secretName: internet-monitor-cl-tafu-casa-tls
